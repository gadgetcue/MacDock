[package]
name = "macdock"
version = "3.0.0"
edition = "2021"
build = "build.rs"
description = "MacDock - macOS-style dock, menu bar and Launchpad for Windows (Rust)"

[[bin]]
name = "macdock"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Input", "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Accessibility",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Com",
  "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Com_StructuredStorage",
  "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs", "Win32_Security", "Win32_System_WindowsProgramming", "Win32_System_Performance",
  "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Devices_Display", "Win32_System_Shutdown",
  "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Wmi", "Win32_System_Rpc",
  "Win32_UI_Input_Pointer", "Win32_Devices_HumanInterfaceDevice", "Win32_Foundation",
  "Win32_System_Console", "Win32_System_IO", "Win32_System_Services", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Media_Control", "Devices_Radios", "Devices_Enumeration", "Devices_Bluetooth", "Win32_Devices_FunctionDiscovery", "Foundation", "Foundation_Collections", "Storage_Streams",
] }

serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[patch.crates-io]
windows-link = { path = "vendor/windows-link" }
